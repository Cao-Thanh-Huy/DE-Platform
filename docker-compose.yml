# ============================================================
# DE Platform — Docker Compose
# Lakehouse: Trino + MinIO + Nessie + Iceberg
# Orchestration: Dagster (dynamic pipelines)
# Secrets: HashiCorp Vault
# API: FastAPI Backend
# UI: DE Studio (React)
#
# Tài nguyên tối ưu cho máy 8GB RAM
# ============================================================

services:
  # ── PostgreSQL (shared: Nessie + Dagster metadata) ──────
  postgres:
    image: postgres:15-alpine
    container_name: de-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deplatform123}
      POSTGRES_DB: ${POSTGRES_DB:-deplatform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deplatform}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    networks:
      - de-network

  # ── MinIO (S3-compatible Object Storage) ────────────────
  minio:
    image: minio/minio:latest
    container_name: de-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123456}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    networks:
      - de-network

  # ── MinIO Init (tạo buckets) ────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: de-minio-init
    entrypoint: ["/bin/sh", "/init/init-buckets.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123456}
    volumes:
      - ./infrastructure/minio/init-buckets.sh:/init/init-buckets.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - de-network

  # ── Nessie (Iceberg Catalog + Git Versioning) ──────────
  nessie:
    image: projectnessie/nessie:latest
    container_name: de-nessie
    environment:
      - NESSIE_VERSION_STORE_TYPE=JDBC
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-deplatform}
      - QUARKUS_DATASOURCE_USERNAME=${POSTGRES_USER:-deplatform}
      - QUARKUS_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-deplatform123}
      # Giới hạn JVM cho máy ít RAM
      - JAVA_OPTS_APPEND=-Xmx256m -Xms128m
    ports:
      - "19120:19120"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v2/config"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    restart: unless-stopped
    networks:
      - de-network

  # ── Trino (Query Engine) ───────────────────────────────
  trino:
    image: trinodb/trino:480
    container_name: de-trino
    volumes:
      - ./infrastructure/trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./infrastructure/trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ./infrastructure/trino/etc/node.properties:/etc/trino/node.properties:ro
      - ./infrastructure/trino/etc/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      nessie:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M
    restart: unless-stopped
    networks:
      - de-network

  # ── HashiCorp Vault (Secrets Management) ───────────────
  vault:
    image: hashicorp/vault:latest
    container_name: de-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped
    networks:
      - de-network

  # ── Vault Init (ghi secrets ban đầu) ──────────────────
  vault-init:
    image: hashicorp/vault:latest
    container_name: de-vault-init
    entrypoint: ["/bin/sh", "/init/init-vault.sh"]
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123456}
      POSTGRES_USER: ${POSTGRES_USER:-deplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deplatform123}
      POSTGRES_DB: ${POSTGRES_DB:-deplatform}
    volumes:
      - ./infrastructure/vault/init-vault.sh:/init/init-vault.sh:ro
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - de-network

  # ── Dagster Webserver (Pipeline UI + GraphQL) ──────────
  dagster-webserver:
    image: lakehouse-dagster-webserver:latest
    container_name: de-dagster-webserver
    entrypoint: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/dagster_home/workspace.yaml"]
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_POSTGRES_USER: ${POSTGRES_USER:-deplatform}
      DAGSTER_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deplatform123}
      DAGSTER_POSTGRES_HOST: postgres
      DAGSTER_POSTGRES_DB: ${POSTGRES_DB:-deplatform}
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      PIPELINE_DEFINITIONS_DIR: /opt/dagster/pipelines
    volumes:
      - ./dagster/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - ./dagster/workspace.yaml:/opt/dagster/dagster_home/workspace.yaml:ro
      - ./dagster/app:/opt/dagster/app
      - pipeline_definitions:/opt/dagster/pipelines
    ports:
      - "${DAGSTER_WEBSERVER_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    networks:
      - de-network

  # ── Dagster Daemon (Scheduler + Run Launcher) ──────────
  dagster-daemon:
    image: lakehouse-dagster-daemon:latest
    container_name: de-dagster-daemon
    entrypoint: ["dagster-daemon", "run", "-w", "/opt/dagster/dagster_home/workspace.yaml"]
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_POSTGRES_USER: ${POSTGRES_USER:-deplatform}
      DAGSTER_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deplatform123}
      DAGSTER_POSTGRES_HOST: postgres
      DAGSTER_POSTGRES_DB: ${POSTGRES_DB:-deplatform}
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      PIPELINE_DEFINITIONS_DIR: /opt/dagster/pipelines
    volumes:
      - ./dagster/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro
      - ./dagster/workspace.yaml:/opt/dagster/dagster_home/workspace.yaml:ro
      - ./dagster/app:/opt/dagster/app
      - pipeline_definitions:/opt/dagster/pipelines
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    restart: unless-stopped
    networks:
      - de-network

  # ── FastAPI Backend ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: de-backend
    environment:
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_USER: admin
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123456}
      NESSIE_URI: http://nessie:19120/api/v2
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      DAGSTER_WEBSERVER_URL: http://dagster-webserver:3000
      DAGSTER_GRAPHQL_URL: http://dagster-webserver:3000/graphql
      PIPELINE_DEFINITIONS_DIR: /opt/dagster/pipelines
    volumes:
      - pipeline_definitions:/opt/dagster/pipelines
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - trino
      - nessie
      - minio
      - vault
      - dagster-webserver
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    networks:
      - de-network

  # ── Frontend (DE Studio) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: de-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped
    networks:
      - de-network

# ── Volumes ──────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  pipeline_definitions:
    driver: local

# ── Network ──────────────────────────────────────────────
networks:
  de-network:
    driver: bridge
